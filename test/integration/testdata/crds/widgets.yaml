# A namespaced custom resource, standing in for Shipwright's Build. It is the
# Confined Resource the suite exercises: cluster-wide LIST and WATCH requests for
# it arrive at Mirage without a namespace and leave with one.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.mirage.test
spec:
  group: mirage.test
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                note:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
